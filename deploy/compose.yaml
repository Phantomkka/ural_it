name: ${NETCITY_PROJECT_NAME:-netcity-online}
x-server: &server
  image: ${NETCITY_PROJECT_NAME:-netcity-online}-server:${NETCITY_RELEASE:-local}
  build:
    context: ..
    dockerfile: Dockerfile
    target: server
    args:
      VCS_REF: ${NETCITY_RELEASE:-development}
    secrets:
      - proxy_ca
  user: "${NETCITY_UID:-1000}:${NETCITY_GID:-1000}"
  environment:
    NODE_ENV: production
    AUTH_PROXY_HOPS: "1"
    NETCITY_ORIGIN: ${NETCITY_ORIGIN:-}
    NETCITY_LEGACY_ORIGINS: ${NETCITY_LEGACY_ORIGINS:-}
    DB_HOST: db
    DB_USER: ${POSTGRES_USER:-netcity}
    DB_NAME: ${POSTGRES_DB:-netcity}
    DB_PASSWORD_FILE: /run/secrets/postgres_password
    PORT: "2567"
  secrets:
    - postgres_password
  networks:
    - backend
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,size=64m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: ${NETCITY_SERVER_MEMORY:-512m}
  cpus: ${NETCITY_SERVER_CPUS:-1.0}
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  db:
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netcity}
      POSTGRES_DB: ${POSTGRES_DB:-netcity}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    command: [postgres, -c, max_connections=30, -c, shared_buffers=64MB]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s
    mem_limit: ${NETCITY_DB_MEMORY:-512m}
    cpus: ${NETCITY_DB_CPUS:-1.0}
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  migrate:
    <<: *server
    restart: "no"
    command: [node, --import, tsx, deploy/bootstrap.mjs, migrate]
    depends_on:
      db: { condition: service_healthy }
  server:
    <<: *server
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:2567/health").then(async r=>{if(!r.ok||(await r.json()).persistence!=="postgres")process.exit(1)}).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
  client:
    image: ${NETCITY_PROJECT_NAME:-netcity-online}-client:${NETCITY_RELEASE:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: client
      args:
        VCS_REF: ${NETCITY_RELEASE:-development}
      secrets: [proxy_ca]
    restart: unless-stopped
    environment:
      NETCITY_SITE: ${NETCITY_SITE:-localhost}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost},server,db
      no_proxy: ${no_proxy:-127.0.0.1,localhost},server,db
    ports:
      - "${NETCITY_BIND:-127.0.0.1}:${NETCITY_HTTP_PORT:-18080}:80"
      - "${NETCITY_BIND:-127.0.0.1}:${NETCITY_HTTPS_PORT:-18443}:443"
    networks: [edge, backend]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=32m"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, --spider, http://127.0.0.1:8081/healthz]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      server: { condition: service_healthy }
    mem_limit: ${NETCITY_CLIENT_MEMORY:-256m}
    cpus: ${NETCITY_CLIENT_CPUS:-0.5}
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  edge: {}
  backend:
    internal: true
volumes:
  postgres-data: {}
  caddy-data: {}
  caddy-config: {}
secrets:
  postgres_password:
    file: ${NETCITY_SECRET_FILE:?Set an absolute NETCITY_SECRET_FILE path}
  proxy_ca:
    file: ${NETCITY_BUILD_CA:-/dev/null}
